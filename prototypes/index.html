<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Visualisation Options</title>
<style>
  :root{--bg:#0a0a0c;--ink:#eeece8;--mute:#a09d97;--line:rgba(238,236,232,.14);--on:#eeece8;--on-ink:#0a0a0c}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0a0a0c;--ink:#eeece8}}
  :root[data-theme="dark"]{--bg:#0a0a0c;--ink:#eeece8}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-rows:auto 1fr}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;border-bottom:1px solid var(--line)}
  .bar p{font-size:.875rem;color:var(--mute);margin-right:auto}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);font:600 .875rem/1 inherit;font-family:inherit;cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--on);color:var(--on-ink);border-color:var(--on)}
  .tabs button:focus-visible,.bar a:focus-visible{outline:2px solid #7aa2ff;outline-offset:2px}
  .bar a{color:var(--mute);font-size:.875rem}
  iframe{width:100%;height:100%;border:0;display:block;background:#0a0a0c}
</style>
</head>
<body>
<div class="bar">
  <p>Three first-screen sketches. Drag the scene, select a role, try the timeline along the bottom.</p>
  <div class="tabs" role="tablist" aria-label="Options">
    <button role="tab" aria-selected="true" data-src="model.html">A · The Model</button>
    <button role="tab" aria-selected="false" data-src="terrain.html">B · Terrain</button>
    <button role="tab" aria-selected="false" data-src="strands.html">C · Strands</button>
  </div>
  <a id="open" href="model.html" target="_blank" rel="noopener">Open full screen</a>
</div>
<iframe id="view" src="model.html" title="Option preview"></iframe>
<script>
  const tabs=[...document.querySelectorAll('[role=tab]')],view=document.getElementById('view'),open=document.getElementById('open');
  tabs.forEach(t=>t.addEventListener('click',()=>{tabs.forEach(x=>x.setAttribute('aria-selected',String(x===t)));view.src=t.dataset.src;open.href=t.dataset.src;}));
</script>
</body>
</html>
