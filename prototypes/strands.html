<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Option C · Strands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#06070d;--ink:#eef0f6;--mute:#9aa0b2;--line:rgba(238,240,246,.12);--gtm:#ff5b3a;--ads:#5a86ff;--build:#2fc38f;--people:#f3b23a;--ease:cubic-bezier(.16,1,.3,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(90% 70% at 60% 55%,#10132a 0%,#06070d 70%) fixed,var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--ads);color:#fff}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--ads);outline-offset:3px;border-radius:4px}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .ui{position:fixed;inset:0;pointer-events:none;display:grid;grid-template-rows:auto auto 1fr auto}
  .ui > *{pointer-events:auto}
  .top{display:flex;align-items:center;gap:28px;padding:22px clamp(16px,4vw,48px);font-size:.9375rem}
  .name{font-weight:700;margin-right:auto;text-decoration:none;letter-spacing:-.01em}
  .top nav{display:flex;gap:24px;color:var(--mute)}
  .top nav a{text-decoration:none}.top nav a:hover{color:var(--ink)}
  .cv{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600}
  .intro{padding:clamp(8px,3vh,36px) clamp(16px,4vw,48px) 0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:end;pointer-events:none}
  .intro > *{pointer-events:auto}
  h1{font-weight:650;font-size:clamp(2.3rem,4.6vw,4.4rem);line-height:.98;letter-spacing:-.035em;text-wrap:balance;max-width:14ch}
  .lead{color:var(--mute);font-size:1.0625rem;line-height:1.55;max-width:42ch}
  .lead b{color:var(--ink);font-weight:600}
  .acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;min-height:46px;padding:0 20px;border-radius:999px;font-weight:600;text-decoration:none;border:1px solid rgba(238,240,246,.25);transition:border-color .2s,background-color .2s}
  .btn:hover{border-color:var(--ink)}
  .btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .keys{display:flex;flex-wrap:wrap;gap:6px;padding:20px clamp(16px,4vw,48px) 0;align-self:start}
  .keys button{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px 0 10px;border-radius:999px;border:1px solid var(--line);background:rgba(6,7,13,.5);color:var(--ink);font:500 .875rem/1 inherit;font-family:inherit;cursor:pointer;transition:border-color .2s,background-color .2s}
  .keys button i{width:18px;height:3px;border-radius:2px;background:var(--c);box-shadow:0 0 10px var(--c)}
  .keys button:hover,.keys button[aria-pressed="true"]{border-color:var(--c);background:rgba(255,255,255,.04)}
  .labels{position:fixed;inset:0;pointer-events:none}
  .tag{position:absolute;left:0;top:0;pointer-events:auto;background:none;border:0;color:var(--ink);font:inherit;cursor:pointer;white-space:nowrap;will-change:transform}
  .tag > div{transform:translate(-50%,calc(-100% - 8px));text-align:center;transition:opacity .3s var(--ease)}
  .tag small{display:block;font-size:.6875rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
  .tag b{font-weight:600;font-size:.9375rem}
  .tag.on small{color:var(--ink)}
  .tag.dim > div{opacity:.5}
  .bottom{display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px;padding:0 clamp(16px,4vw,48px) 24px}
  .rail{display:flex;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .rail button{flex:1 0 auto;min-width:104px;background:none;border:0;color:var(--mute);font:inherit;text-align:left;padding:12px 12px 6px 0;cursor:pointer;position:relative;transition:color .2s}
  .rail button::before{content:"";position:absolute;left:0;top:-1px;height:2px;width:0;background:var(--ink);transition:width .5s var(--ease)}
  .rail button span{display:block;font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase}
  .rail button b{font-weight:600;font-size:.9375rem}
  .rail button:hover,.rail button.on{color:var(--ink)}.rail button.on::before{width:100%}
  .detail{width:min(340px,40vw);padding:18px 20px;border-radius:16px;background:rgba(16,19,36,.7);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .detail small{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
  .detail h2{font-weight:650;font-size:1.5rem;letter-spacing:-.02em;margin:6px 0 2px}
  .detail p{color:var(--mute);font-size:.9375rem;line-height:1.5}
  .detail .proof{color:var(--ink);margin-top:10px}
  .detail .ls{display:flex;gap:6px;margin-top:12px}
  .detail .ls i{width:22px;height:3px;border-radius:2px;background:var(--c)}
  @media (max-width:820px){
    .top nav{display:none}
    .intro{grid-template-columns:1fr;gap:14px}
    h1{font-size:2.2rem}
    .lead{font-size:1rem}
    .keys{padding-top:12px}
    .bottom{grid-template-columns:1fr}
    .detail{width:auto;order:-1;padding:12px 16px}
    .detail h2{font-size:1.2rem}
    .tag:not(.on) small{display:none}
    .tag b{font-size:.8125rem}
  }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="labels" id="labels"></div>
<div class="ui">
  <header class="top">
    <a class="name" href="#">Matvey Lutsenko</a>
    <nav><a href="#">Experience</a><a href="#">Project</a><a href="#">Contact</a></nav>
    <a class="cv" href="#cv">Download CV</a>
  </header>
  <div class="intro">
    <h1>I build the processes and tools that help teams scale.</h1>
    <div>
      <p class="lead">Four threads run through my work: <b>go-to-market</b>, <b>ads &amp; measurement</b>, <b>building with AI</b> and <b>people</b>. Each node is a role where they came together.</p>
      <div class="acts"><a class="btn solid" href="mailto:mtvlutsenko@gmail.com">Get in touch</a><a class="btn" href="#">See the work</a></div>
    </div>
  </div>
  <div class="keys" role="group" aria-label="Follow a thread">
    <button type="button" data-k="gtm" aria-pressed="false" style="--c:var(--gtm)"><i></i>Go-to-market</button>
    <button type="button" data-k="ads" aria-pressed="false" style="--c:var(--ads)"><i></i>Ads &amp; measurement</button>
    <button type="button" data-k="build" aria-pressed="false" style="--c:var(--build)"><i></i>Build &amp; AI</button>
    <button type="button" data-k="people" aria-pressed="false" style="--c:var(--people)"><i></i>People &amp; research</button>
  </div>
  <div class="bottom">
    <nav class="rail" id="rail" aria-label="Career stops"></nav>
    <aside class="detail" id="detail" aria-live="polite"></aside>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { STOPS, makeLabels, makeRail, reduceMotion, ease } from './career.js';

const COLORS = { gtm: 0xff5b3a, ads: 0x5a86ff, build: 0x2fc38f, people: 0xf3b23a };
const LANE = { gtm: 0, ads: 1, build: 2, people: 3 };

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(-2, 4, 25);
const controls = new OrbitControls(camera, canvas);
controls.enableZoom = false; controls.enablePan = false; controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minPolarAngle = 1.0; controls.maxPolarAngle = 1.9; controls.minAzimuthAngle = -0.8; controls.maxAzimuthAngle = 0.8;

const world = new THREE.Group(); scene.add(world);
const X = i => -8.5 + i * 3.4;
const nodeY = i => -0.6 + i * 0.32;

// deterministic wander
const rnd = (a) => { const x = Math.sin(a * 127.1) * 43758.5453; return x - Math.floor(x); };

const strands = {};
for (const k of Object.keys(COLORS)) {
  const stops = STOPS.map((s, i) => ({ s, i })).filter(o => o.s.lines.includes(k));
  if (!stops.length) continue;
  const pts = [];
  const lead = (LANE[k] - 1.5) * 0.12;
  stops.forEach((o, j) => {
    const p = new THREE.Vector3(X(o.i), nodeY(o.i) + lead, lead);
    if (j === 0) pts.push(p.clone().add(new THREE.Vector3(-1.1, (rnd(LANE[k] + 1) - 0.5) * 1.6, (rnd(LANE[k] + 9) - 0.5) * 1.6)));
    pts.push(p);
    const next = stops[j + 1];
    if (next) {
      // a thread drifts away from the bundle between roles, then braids back in
      const gap = next.i - o.i;
      for (let g = 1; g <= gap * 2 - 1; g++) {
        const t = g / (gap * 2);
        const x = X(o.i) + (X(next.i) - X(o.i)) * t;
        const y = nodeY(o.i) + (nodeY(next.i) - nodeY(o.i)) * t;
        const sway = Math.sin(t * Math.PI);
        const ang = LANE[k] * 1.57 + o.i * 0.9 + g;
        pts.push(new THREE.Vector3(x, y + Math.cos(ang) * 1.05 * sway, Math.sin(ang) * 1.3 * sway));
      }
    } else pts.push(p.clone().add(new THREE.Vector3(1.1, (rnd(LANE[k] + 4) - 0.5) * 1.4, (rnd(LANE[k] + 7) - 0.5) * 1.4)));
  });
  const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
  const col = new THREE.Color(COLORS[k]);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 400, 0.05, 10), new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.6, roughness: 0.35, metalness: 0.1, transparent: true }));
  world.add(tube);
  // flowing light along the thread
  const n = 70, arr = new Float32Array(n * 3);
  const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  const pm = new THREE.PointsMaterial({ color: col.clone().lerp(new THREE.Color(0xffffff), 0.5), size: 0.09, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
  const points = new THREE.Points(pg, pm); world.add(points);
  strands[k] = { curve, samples: curve.getSpacedPoints(600), tube, points, n, off: Array.from({ length: n }, (_, i) => i / n + rnd(i + LANE[k] * 50) * 0.01) };
}

// glass nodes
const glass = new THREE.MeshPhysicalMaterial({ color: 0x0c1024, roughness: 0.08, metalness: 0.35, clearcoat: 1, clearcoatRoughness: 0.04, envMapIntensity: 0.9 });
const nodes = STOPS.map((s, i) => {
  const r = 0.3 + s.weight * 0.11;
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 64, 48), glass.clone());
  m.position.set(X(i), nodeY(i), 0); m.userData.id = s.id; world.add(m);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r * 1.35, 0.008, 8, 96), new THREE.MeshBasicMaterial({ color: 0xeef0f6, transparent: true, opacity: 0.35 }));
  ring.position.copy(m.position); world.add(ring);
  return { s, m, r, ring, anchor: new THREE.Vector3() };
});

scene.add(new THREE.AmbientLight(0x404a70, 0.6));
const key = new THREE.PointLight(0xffffff, 40, 40); key.position.set(-4, 6, 8); scene.add(key);

// overlay
const labels = makeLabels(document.getElementById('labels'), s => `<div><small>${s.when}</small><b>${s.short}</b></div>`);
const detail = document.getElementById('detail');
let selected = 'google', thread = null, hovered = null;
const rail = makeRail(document.getElementById('rail'), id => select(id));
labels.els.forEach(el => el.addEventListener('click', () => select(el.dataset.id)));
function select(id) {
  selected = id; rail.set(id);
  const s = STOPS.find(x => x.id === id);
  detail.innerHTML = `<small>${s.when} · ${s.place}</small><h2>${s.name}</h2><p>${s.role}</p><p class="proof">${s.proof}</p><div class="ls">${s.lines.map(l => `<i style="--c:var(--${l})"></i>`).join('')}</div>`;
  applyDim();
}
const keys = [...document.querySelectorAll('[data-k]')];
keys.forEach(b => b.addEventListener('click', () => {
  thread = thread === b.dataset.k ? null : b.dataset.k;
  keys.forEach(x => x.setAttribute('aria-pressed', String(x.dataset.k === thread)));
  applyDim();
}));
function applyDim() {
  labels.els.forEach(el => {
    const s = STOPS.find(x => x.id === el.dataset.id);
    el.classList.toggle('on', s.id === selected);
    el.classList.toggle('dim', thread ? !s.lines.includes(thread) : s.id !== selected);
  });
}
select('google');

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(-2, -2);
let downAt = null;
canvas.addEventListener('pointermove', e => ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1));
canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e => { if (downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) < 5 && hovered) select(hovered); downAt = null; });

function layout() {
  const w = innerWidth, h = innerHeight, narrow = w < 820;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = narrow ? 62 : 30; camera.updateProjectionMatrix();
  controls.target.set(narrow ? 0 : 0.4, narrow ? -1.2 : 2.6, 0);
  world.rotation.z = narrow ? Math.PI / 2 : 0;
}
addEventListener('resize', layout); layout();

const tmp = new THREE.Vector3(), t0 = performance.now();
function frame(now) {
  const t = Math.max(0, (now - t0) / 1000);
  const grow = reduceMotion ? 1 : ease(Math.min(1, t / 2.4));
  for (const [k, st] of Object.entries(strands)) {
    const on = !thread || thread === k;
    st.tube.material.opacity += ((on ? 1 : 0.12) - st.tube.material.opacity) * 0.1;
    st.points.material.opacity = st.tube.material.opacity * 0.9;
    st.tube.geometry.setDrawRange(0, Math.floor(st.tube.geometry.index.count * grow / 3) * 3);
    const a = st.points.geometry.attributes.position;
    for (let i = 0; i < st.n; i++) {
      const u = ((st.off[i] + (reduceMotion ? 0 : t * 0.035)) % 1) * grow;
      const q = st.samples[Math.min(600, Math.floor(u * 600))]; a.setXYZ(i, q.x, q.y, q.z);
    }
    a.needsUpdate = true;
  }
  if (!reduceMotion) world.rotation.y = Math.sin(t * 0.15) * 0.12;
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(nodes.map(n => n.m))[0];
  hovered = hit ? hit.object.userData.id : null;
  canvas.style.cursor = hovered ? 'pointer' : 'grab';
  nodes.forEach((n, i) => {
    const target = (n.s.id === selected ? 1.18 : n.s.id === hovered ? 1.08 : 1) * Math.min(1, grow * 1.6);
    n.m.scale.setScalar(n.m.scale.x + (target - n.m.scale.x) * 0.12);
    n.ring.lookAt(camera.position);
    n.ring.material.opacity = n.s.id === selected ? 0.9 : 0.3;
    n.anchor.copy(n.m.position); world.localToWorld(n.anchor);
    tmp.set(0, n.r * n.m.scale.x + 0.15, 0); n.anchor.add(tmp);
  });
  controls.update();
  renderer.render(scene, camera);
  labels.update(THREE, camera, nodes.map(n => n.anchor), innerWidth, innerHeight);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
